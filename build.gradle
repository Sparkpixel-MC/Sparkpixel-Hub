plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'xyz.jpenilla.run-paper' version '3.1.0'
}

group = 'top.sparkpixel'
version = '4.0.0'
description = 'Sparkpixel-Hub - modern Paper lobby suite'

repositories {
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://repo.codemc.org/repository/maven-public' }
    maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url 'https://oss.sonatype.org/content/groups/public/' }
    maven { url 'https://jitpack.io' }
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url 'https://libraries.minecraft.net/' }
    maven { url 'https://repo.opencollab.dev/main/' }
    maven { url 'https://repo.aikar.co/content/groups/aikar/' }
}

dependencies {
    // Paper 1.21.11 API (also provides Adventure and Bungee Chat)
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    compileOnly 'com.mojang:authlib:1.5.25'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'com.github.shynixn.headdatabase:hdb-api:1.0'
    compileOnly 'net.luckperms:api:5.4'

    // Implementation dependencies (will be included in the jar)
    implementation 'javax.inject:javax.inject:1'
    implementation 'javax.annotation:javax.annotation-api:1.2'
    implementation('com.github.BGMP.CommandFramework:command-framework-bukkit:master') {
        exclude group: 'org.bukkit'
        exclude group: 'org.spigotmc'
        exclude group: 'io.papermc.paper'
        exclude group: 'dev.folia'
    }
    implementation('co.aikar:acf-paper:0.5.1-SNAPSHOT') {
        exclude group: 'org.bukkit'
        exclude group: 'org.spigotmc'
        exclude group: 'io.papermc.paper'
        exclude group: 'dev.folia'
    }
}

tasks {
    runServer {
        minecraftVersion("1.21.11")
    }

    shadowJar {
        archiveClassifier.set('')

        // Relocate libraries to avoid conflicts
        relocate 'cl.bgmp', 'top.sparkpixel.hub.libs.command'
        relocate 'co.aikar', 'top.sparkpixel.hub.libs.aikar'

        // Include only specified dependencies
        dependencies {
            include(dependency('com.github.BGMP.CommandFramework:command-framework-bukkit'))
            include(dependency('javax.inject:javax.inject'))
            include(dependency('co.aikar:acf-paper'))
        }
    }

    build {
        dependsOn shadowJar
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [
            'name': rootProject.name,
            'version': project.version,
            'description': project.description ?: 'Sparkpixel-Hub - modern Paper lobby suite',
            'url': 'https://www.spigotmc.org/resources/118904/'
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}