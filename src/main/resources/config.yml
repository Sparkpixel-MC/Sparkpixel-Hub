# Sparkpixel-Hub
# Paper 26.3 / Java 25
#
# config.yml contains only bootstrap settings.
# Feature settings live in modules/*.yml, translations in lang/*.yml.

version: 4.0.0

multiple_worlds: false

language:
  enabled: true
  default: en_us
  fallback: en_us
  localize-content: false

disabled-worlds:
  invert: false
  worlds:
    - world_nether

legacySystems:
  permissionsEnabled: false
