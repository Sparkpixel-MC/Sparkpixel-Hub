name: ${name}
authors: ["Sparkpixel"]
version: ${version}
description: ${description}
api-version: '1.21.11'
main: top.sparkpixel.hub.SparkpixelHubPlugin
loadbefore: [Essentials]
softdepend: [PlaceholderAPI, HeadDatabase, Multiverse-Core, LuckPerms, SparkChess]
permissions:
  sparkpixelhub.parkour.use:
    description: Allows starting the lobby parkour
    default: true
  sparkpixelhub.*:
    description: Gives access to all Sparkpixel-Hub permissions
    children:
      sparkpixelhub.command.*: true
      sparkpixelhub.bypass.*: true
      sparkpixelhub.alert.*: true
      sparkpixelhub.trampoline.use: true
  sparkpixelhub.command.*:
    description: Gives access to all command permissions
    children:
      sparkpixelhub.command.help: true
      sparkpixelhub.command.reload: true
      sparkpixelhub.command.openmenu: true
      sparkpixelhub.command.holograms: true
      sparkpixelhub.command.gamemode: true
      sparkpixelhub.command.gamemode.others: true
      sparkpixelhub.command.fly: true
      sparkpixelhub.command.fly.others: true
      sparkpixelhub.command.setlobby: true
      sparkpixelhub.command.vanish: true
      sparkpixelhub.command.buildmode: true
      sparkpixelhub.command.buildmode.others: true
      sparkpixelhub.command.pvp: true
      sparkpixelhub.command.trampoline: true
      sparkpixelhub.command.stats: true
      sparkpixelhub.command.feedback: true
  sparkpixelhub.bypass.*:
    description: Gives access to all bypass permissions
    children:
      sparkpixelhub.bypass.antiwdl: true
      sparkpixelhub.bypass.doublejump: false
  sparkpixelhub.alert.*:
    description: Gives access to all alert permissions
    children:
      sparkpixelhub.alert.antiwdl: true