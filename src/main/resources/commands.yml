# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~#
# | CUSTOM COMMANDS                          |
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~#
version: 4.0.0
custom_commands:

  # Command name, this will be used as the main command
  website:
    # List any aliases for the command here
    aliases:
      - web
    # Actions to be executed
    actions:
      - '[MESSAGE] <aqua>Website: <white>www.examplemc.net'
  clearinventory:
    # Players will require this permission to execute this command.
    permission: sparkpixelhub.clearinventory
    aliases:
      - ci
    actions:
      - '[CONSOLE] minecraft:clear %player%'
      - '[MESSAGE] <light_purple>Sparkpixel-Hub <yellow>Your inventory has been cleared!'

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~#
# | SPARKPIXEL-HUB COMMANDS                       |
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~#
# It's highly recommended to restart your server if you edit anything below

commands:
  gamemode:
    enabled: true
    aliases:
      - gm
  gms:
    enabled: true
  gmc:
    enabled: true
  gma:
    enabled: true
  gmsp:
    enabled: true
  fly:
    enabled: true
  setlobby:
    enabled: true
  lobby:
    enabled: true
  vanish:
    enabled: true
    aliases:
      - v
  buildmode:
    enabled: true
    aliases:
      - build