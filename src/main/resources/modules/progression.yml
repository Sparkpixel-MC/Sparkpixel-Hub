# Lobby progression, daily login, quests, achievements and retention.
progression:
  enabled: true

  menu-item:
    material: COMPASS
    slot: 4
    name: "<gradient:#9863E7:#545eb6><bold>Sparkpixel Hub</bold></gradient>"
    lore:
      - "<gray>右键打开大厅主菜单"
