# Sparkpixel-Hub server selector
# Menu ID = file name. Open with: [MENU] serverselector

title: "<gradient:#9863E7:#545eb6><bold>Server Selector</bold></gradient>"
rows: 5

# Filled into every unused slot. Set to null or remove to disable.
filler:
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  factions:
    slot: 20
    material: TNT
    name: "<yellow><bold>Factions</bold>"
    lore:
      - "<gray>Competitive team survival"
      - "<dark_gray>Click to connect"
    actions:
      - "[CLOSE]"
      - "[MESSAGE] <green>Sending you to <yellow>Factions</yellow>..."
      - "[PROXY] factions"
  survival:
    slot: 24
    material: GRASS_BLOCK
    name: "<green><bold>Survival</bold>"
    lore:
      - "<gray>Classic survival experience"
      - "<dark_gray>Click to connect"
    actions:
      - "[CLOSE]"
      - "[MESSAGE] <green>Sending you to <yellow>Survival</yellow>..."
      - "[PROXY] survival"